name: release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write
  id-token: write

jobs:
  test:
    name: Testar antes da release em ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: runner-implementacao
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
          cache-dependency-path: runner-implementacao/go.mod

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Validar tag SemVer
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Tag deve seguir SemVer, exemplo v1.0.0"; exit 1; }
          fi

      - name: Verificar arquivos gerados fora do Git
        if: runner.os != 'Windows'
        run: ./scripts/check-generated-files.sh

      - name: Rodar go vet
        run: go vet ./...

      - name: Rodar testes Go
        run: go test ./...

      - name: Validar workflow, artefatos e Cosign
        if: runner.os != 'Windows'
        run: ./scripts/check-release-artifacts.sh

      - name: Compilar e testar assinador.jar
        if: runner.os != 'Windows'
        run: make -C assinador clean all test

  linux:
    name: Gerar artefatos Linux
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: runner-implementacao
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
          cache-dependency-path: runner-implementacao/go.mod

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Compilar assinador.jar
        run: make -C assinador clean all

      - name: Gerar binários Linux
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          GOOS=linux GOARCH=amd64 go build -ldflags "-X main.version=${VERSION}" -o "dist/assinatura-${VERSION}-linux-amd64.AppImage" ./cmd/assinatura
          GOOS=linux GOARCH=amd64 go build -ldflags "-X main.version=${VERSION}" -o "dist/simulador-${VERSION}-linux-amd64.AppImage" ./cmd/simulador
          chmod +x dist/*.AppImage
          cp assinador/target/assinador.jar "dist/assinador-${VERSION}.jar"

      - name: Enviar artefatos Linux para job de publicação
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: runner-implementacao/dist/*

  windows:
    name: Gerar artefatos Windows
    needs: test
    runs-on: windows-latest
    defaults:
      run:
        working-directory: runner-implementacao
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
          cache-dependency-path: runner-implementacao/go.mod

      - name: Gerar binários Windows
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          GOOS=windows GOARCH=amd64 go build -ldflags "-X main.version=${VERSION}" -o "dist/assinatura-${VERSION}-windows-amd64.exe" ./cmd/assinatura
          GOOS=windows GOARCH=amd64 go build -ldflags "-X main.version=${VERSION}" -o "dist/simulador-${VERSION}-windows-amd64.exe" ./cmd/simulador

      - name: Enviar artefatos Windows para job de publicação
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: runner-implementacao/dist/*

  macos:
    name: Gerar artefatos macOS
    needs: test
    runs-on: macos-latest
    defaults:
      run:
        working-directory: runner-implementacao
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
          cache-dependency-path: runner-implementacao/go.mod

      - name: Gerar pacotes DMG macOS
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist staging/assinatura staging/simulador
          GOOS=darwin GOARCH=amd64 go build -ldflags "-X main.version=${VERSION}" -o staging/assinatura/assinatura ./cmd/assinatura
          GOOS=darwin GOARCH=amd64 go build -ldflags "-X main.version=${VERSION}" -o staging/simulador/simulador ./cmd/simulador
          hdiutil create -volname "assinatura" -srcfolder staging/assinatura -ov -format UDZO "dist/assinatura-${VERSION}-macos-amd64.dmg"
          hdiutil create -volname "simulador" -srcfolder staging/simulador -ov -format UDZO "dist/simulador-${VERSION}-macos-amd64.dmg"

      - name: Enviar artefatos macOS para job de publicação
        uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: runner-implementacao/dist/*

  publish:
    name: Assinar com Cosign e publicar GitHub Release
    needs: [linux, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - name: Baixar artefatos compilados
        uses: actions/download-artifact@v4
        with:
          path: runner-implementacao/dist
          merge-multiple: true

      - name: Conferir artefatos antes da assinatura
        run: |
          set -euo pipefail
          pwd
          test -d runner-implementacao/dist
          ls -la runner-implementacao/dist

      - name: Instalar Cosign
        uses: sigstore/cosign-installer@v3

      - name: Gerar checksums e assinar todos os artefatos com Cosign keyless/OIDC
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          set -euo pipefail
          cd runner-implementacao/dist
          test -n "$(find . -maxdepth 1 -type f -print -quit)"
          sha256sum * > checksums.txt

          # Arquivos primários distribuídos na release. Para cada artefato,
          # o pipeline publica também <artefato>.sig, <artefato>.pem e <artefato>.bundle.
          for f in assinatura-* simulador-* assinador-*.jar checksums.txt; do
            [ -f "$f" ] || continue
            cosign sign-blob --yes --tlog-upload=true \
              --bundle "$f.bundle" \
              --output-signature "$f.sig" \
              --output-certificate "$f.pem" \
              "$f"
          done

      - name: Conferir artefatos antes da publicação
        run: |
          set -euo pipefail
          ls -la runner-implementacao/dist

      - name: Publicar GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: runner-implementacao/dist/*
          fail_on_unmatched_files: true
