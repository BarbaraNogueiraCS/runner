name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Validate SemVer tag
        shell: bash
        run: |
          [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Tag deve seguir SemVer, exemplo v1.0.0"; exit 1; }
      - run: go vet ./...
      - run: go test ./...
      - name: Build and test assinador.jar
        if: runner.os != 'Windows'
        run: make -C assinador clean all test

  linux:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: make -C assinador clean all
      - name: Build Linux AppImage-named artifacts
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          GOOS=linux GOARCH=amd64 go build -ldflags "-X main.version=${VERSION}" -o "dist/assinatura-${VERSION}-linux-amd64.AppImage" ./cmd/assinatura
          GOOS=linux GOARCH=amd64 go build -ldflags "-X main.version=${VERSION}" -o "dist/simulador-${VERSION}-linux-amd64.AppImage" ./cmd/simulador
          chmod +x dist/*.AppImage
          cp assinador/target/assinador.jar "dist/assinador-${VERSION}.jar"
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: dist/*

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
      - name: Build Windows executables
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          GOOS=windows GOARCH=amd64 go build -ldflags "-X main.version=${VERSION}" -o "dist/assinatura-${VERSION}-windows-amd64.exe" ./cmd/assinatura
          GOOS=windows GOARCH=amd64 go build -ldflags "-X main.version=${VERSION}" -o "dist/simulador-${VERSION}-windows-amd64.exe" ./cmd/simulador
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: dist/*

  macos:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
      - name: Build macOS DMG artifacts
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist staging/assinatura staging/simulador
          GOOS=darwin GOARCH=amd64 go build -ldflags "-X main.version=${VERSION}" -o staging/assinatura/assinatura ./cmd/assinatura
          GOOS=darwin GOARCH=amd64 go build -ldflags "-X main.version=${VERSION}" -o staging/simulador/simulador ./cmd/simulador
          hdiutil create -volname "assinatura" -srcfolder staging/assinatura -ov -format UDZO "dist/assinatura-${VERSION}-macos-amd64.dmg"
          hdiutil create -volname "simulador" -srcfolder staging/simulador -ov -format UDZO "dist/simulador-${VERSION}-macos-amd64.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: dist/*

  publish:
    needs: [linux, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: sigstore/cosign-installer@v3
      - name: Generate checksums and sign release artifacts with Cosign keyless OIDC
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          set -euo pipefail
          cd dist
          sha256sum * > checksums.txt

          # Arquivos primários distribuídos na release. Para cada item abaixo,
          # o pipeline publica também <artefato>.sig e <artefato>.pem.
          for f in assinatura-* simulador-* assinador-*.jar checksums.txt; do
            [ -f "$f" ] || continue
            cosign sign-blob --yes --tlog-upload=true \
              --bundle "$f.bundle" \
              --output-signature "$f.sig" \
              --output-certificate "$f.pem" \
              "$f"
          done
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
