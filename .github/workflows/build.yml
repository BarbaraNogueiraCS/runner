name: build

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  test:
    name: Testar código em ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: runner-implementacao
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
          cache-dependency-path: runner-implementacao/go.mod

      - name: Baixar dependências Go
        run: go mod download

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Verificar arquivos gerados fora do Git
        if: runner.os != 'Windows'
        run: ./scripts/check-generated-files.sh

      - name: Rodar go vet
        run: go vet ./...

      - name: Rodar testes Go
        run: go test ./...

      - name: Validar workflow de release e Cosign
        if: runner.os != 'Windows'
        run: ./scripts/check-release-artifacts.sh

      - name: Compilar e testar assinador.jar
        if: runner.os != 'Windows'
        run: make -C assinador clean all test

  build-dev-artifacts:
    name: Compilar binários de desenvolvimento
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: runner-implementacao
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
          cache-dependency-path: runner-implementacao/go.mod

      - name: Baixar dependências Go
        run: go mod download

      - name: Compilar CLIs para validação
        run: |
          set -euo pipefail
          VERSION=dev
          mkdir -p dist
          GOOS=linux GOARCH=amd64 go build -ldflags "-X main.version=${VERSION}" -o dist/assinatura-linux-amd64.AppImage ./cmd/assinatura
          GOOS=linux GOARCH=amd64 go build -ldflags "-X main.version=${VERSION}" -o dist/simulador-linux-amd64.AppImage ./cmd/simulador
          GOOS=windows GOARCH=amd64 go build -ldflags "-X main.version=${VERSION}" -o dist/assinatura-windows-amd64.exe ./cmd/assinatura
          GOOS=windows GOARCH=amd64 go build -ldflags "-X main.version=${VERSION}" -o dist/simulador-windows-amd64.exe ./cmd/simulador
          GOOS=darwin GOARCH=amd64 go build -ldflags "-X main.version=${VERSION}" -o dist/assinatura-macos-amd64 ./cmd/assinatura
          GOOS=darwin GOARCH=amd64 go build -ldflags "-X main.version=${VERSION}" -o dist/simulador-macos-amd64 ./cmd/simulador

      - name: Publicar artefatos de validação do build
        uses: actions/upload-artifact@v4
        with:
          name: runner-dev-binaries
          path: runner-implementacao/dist/*
