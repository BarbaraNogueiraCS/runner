name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: go vet ./...
      - run: go test ./...
      - name: Build assinador.jar
        if: runner.os != 'Windows'
        run: make -C assinador clean all test

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
      - run: mkdir -p dist
      - name: Cross-compile distributable CLIs
        run: |
          VERSION=dev
          GOOS=linux GOARCH=amd64 go build -ldflags "-X main.version=${VERSION}" -o dist/assinatura-linux-amd64.AppImage ./cmd/assinatura
          GOOS=linux GOARCH=amd64 go build -ldflags "-X main.version=${VERSION}" -o dist/simulador-linux-amd64.AppImage ./cmd/simulador
          GOOS=windows GOARCH=amd64 go build -ldflags "-X main.version=${VERSION}" -o dist/assinatura-windows-amd64.exe ./cmd/assinatura
          GOOS=windows GOARCH=amd64 go build -ldflags "-X main.version=${VERSION}" -o dist/simulador-windows-amd64.exe ./cmd/simulador
          GOOS=darwin GOARCH=amd64 go build -ldflags "-X main.version=${VERSION}" -o dist/assinatura-macos-amd64 ./cmd/assinatura
          GOOS=darwin GOARCH=amd64 go build -ldflags "-X main.version=${VERSION}" -o dist/simulador-macos-amd64 ./cmd/simulador
      - uses: actions/upload-artifact@v4
        with:
          name: runner-binaries
          path: dist/*
